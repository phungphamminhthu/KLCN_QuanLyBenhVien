spring.application.name=QuanLyBenhVien

# ===============================
# DATABASE - MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/quanlybenhvien?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# JWT
# ===============================
jwt.secret=QLBV-Dev-JWT-2026-Team-Secret-8fK2mP9xR7vL4nQ6
jwt.expiration=86400000

# ===============================
# EMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Load c?u hình email riêng trên máy
spring.config.import=optional:classpath:application-local.properties

# ===============================
# CLOUDFLARE R2
# ===============================
cloudflare.r2.bucket=quanlybenhvien-images

# Upload file t?i ?a 5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB