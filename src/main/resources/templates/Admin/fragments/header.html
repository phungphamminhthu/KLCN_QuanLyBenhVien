<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header"
        class="top-header">

    <!-- SEARCH -->
    <div class="header-search">

<!--        <span>⌕</span>-->

<!--        <input type="text"-->
<!--               placeholder="Tìm kiếm...">-->

    </div>


    <!-- RIGHT -->
    <div class="header-right">

        <!-- NOTIFICATION -->
        <!-- NOTIFICATION -->
        <div class="notification-wrapper">

            <button type="button"
                    class="notification-button"
                    id="notificationButton"
                    aria-label="Thông báo">

                <span class="notification-icon">🔔</span>

                <span class="notification-badge"
                      id="notificationBadge">
            0
        </span>

            </button>


            <!-- NOTIFICATION PANEL -->
            <div class="notification-panel"
                 id="notificationPanel">

                <div class="notification-header">

                    <div>
                        <h3>Thông báo</h3>

                        <span id="notificationCountText">
                    0 thông báo mới
                </span>
                    </div>

                    <button type="button"
                            id="markAllReadButton">
                        Đánh dấu đã đọc
                    </button>

                </div>


                <div class="notification-list"
                     id="notificationList">

                    <!-- JS render -->

                </div>


                <div class="notification-footer">

                    <a href="/Admin/thong-bao">
                        Xem tất cả thông báo
                    </a>

                </div>

            </div>

        </div>

        <!-- ADMIN -->
        <div class="admin-info">

            <img id="adminAvatar"
                 class="admin-avatar"
                 src="/Images/default-avatar.jpg"
                 alt="Ảnh đại diện"
                 onerror="this.onerror=null; this.src='/Images/default-avatar.jpg';">

            <div class="admin-details">

        <span id="adminName" class="admin-name">
            Quản trị viên
        </span>

                <span id="adminEmail" class="admin-email">
            admin@gmail.com
        </span>

            </div>

        </div>

    </div>

</header>

</body>
</html>
