<div th:fragment="xemTaiKhoan"
     id="viewAccountModal"
     class="view-account-modal">

  <div class="view-account-modal-content">

    <div class="view-account-header">
      <div>
        <h2>Thông tin tài khoản</h2>
        <p>Thông tin chi tiết của người dùng</p>
      </div>

      <button type="button"
              id="closeViewAccountModal"
              class="view-account-close">
        &times;
      </button>
    </div>

    <div class="view-account-body">

      <!-- Avatar -->
      <div class="view-account-avatar-section">
        <img id="viewAccountAvatar"
             alt="Ảnh đại diện">

        <div>
          <h3 id="viewHoTen">---</h3>

          <span id="viewTrangThai"
                class="view-status">
            ---
        </span>
        </div>
      </div>

      <!-- Thông tin -->
      <div class="view-account-info">

        <div class="view-info-item">
          <label>Họ và tên</label>
          <div id="viewHoTenDetail">---</div>
        </div>

        <div class="view-info-item">
          <label>Tên dăng nhập</label>
          <div id="viewTenDangNhap">---</div>
        </div>

        <div class="view-info-item">
          <label>Email</label>
          <div id="viewEmail">---</div>
        </div>

        <div class="view-info-item">
          <label>Số điện thoại</label>
          <div id="viewSoDienThoai">---</div>
        </div>

        <div class="view-info-item">
          <label>Vai trò</label>
          <div id="viewVaiTro">---</div>
        </div>

        <div class="view-info-item">
          <label>Trạng thái</label>
          <div id="viewTrangThaiDetail">---</div>
        </div>

      </div>

    </div>

    <div class="view-account-footer">
      <button type="button"
              id="closeViewAccountButton"
              class="view-close-button">
        Đóng
      </button>
    </div>

  </div>
</div>
