  <div class="audit-filter">

    <!-- SEARCH BÊN TRÁI -->
    <div class="search-wrapper">

        <span class="search-icon">
            ⌕
        </span>

      <input
              type="text"
              id="searchInput"
              placeholder="Tìm kiếm hành động..."
      >

    </div>


    <!-- CÁC BỘ LỌC + BUTTON BÊN PHẢI -->
    <div class="filter-actions">

      <!-- THỜI GIAN -->
      <div class="filter-group">

        <label for="timeFilter">
          Thời gian:
        </label>

        <select id="timeFilter">

          <option value="all">
            Tất cả
          </option>

          <option value="today">
            Hôm nay
          </option>

          <option value="7days">
            7 ngày qua
          </option>

          <option value="30days">
            30 ngày qua
          </option>

        </select>

      </div>


      <!-- NGƯỜI DÙNG -->
      <div class="filter-group">

        <label for="userFilter">
          Người dùng:
        </label>

        <select id="userFilter">

          <option value="all">
            Tất cả
          </option>

        </select>

      </div>


      <!-- TÌM KIẾM -->
      <button
              type="button"
              id="searchButton"
              class="filter-button search-button">

        Tìm kiếm

      </button>


      <!-- RESET -->
      <button
              type="button"
              id="resetButton"
              class="filter-button reset-button">

        ↻ Đặt lại

      </button>

    </div>

  </div>


  <!-- ==============================
       TABLE
  =============================== -->

  <div class="audit-table-card">

    <table>

      <thead>

      <tr>

        <th>STT</th>

        <th>THỜI GIAN</th>

        <th>NGƯỜI DÙNG</th>

        <th>HÀNH ĐỘNG</th>

        <th>ĐỐI TƯỢNG</th>

      </tr>

      </thead>


      <tbody id="auditTableBody">

      <!-- JS render -->

      </tbody>

    </table>


    <!-- ==========================
         PAGINATION
    =========================== -->

    <div class="pagination">

      <button
              type="button"
              id="prevPage">
        &lt;
      </button>


      <div
              id="pageNumbers"
              class="page-numbers">
      </div>


      <button
              type="button"
              id="nextPage">
        &gt;
      </button>

    </div>

  </div>
