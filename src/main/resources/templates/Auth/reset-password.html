<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt lại mật khẩu - MedCare Hospital</title>

    <link rel="stylesheet" href="/Css/Auth/reset-password.css">
</head>

<body>

<div class="page-container">

    <!-- ================================
         KHUNG NGOÀI
    ================================= -->

    <div class="auth-wrapper">

        <!-- ================================
             BRAND
        ================================= -->

        <div class="brand">

            <div class="brand-icon">
                +
            </div>

            <div class="brand-text">

                <strong>
                    MedCare Hospital
                </strong>

                <span>
                    HỆ THỐNG QUẢN LÝ BỆNH VIỆN
                </span>

            </div>

        </div>


        <!-- ================================
             KHUNG FORM
        ================================= -->

        <div class="reset-card">

            <div class="card-icon">
                🔒
            </div>


            <h1>
                Đặt lại mật khẩu
            </h1>


            <p class="description">
                Tạo mật khẩu mới cho tài khoản của bạn.
            </p>


            <form id="resetPasswordForm">

                <!-- ==========================
                     EMAIL
                =========================== -->

                <div class="form-group">

                    <label for="Email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="Email"
                            readonly>

                </div>


                <!-- ==========================
                     MẬT KHẨU MỚI
                =========================== -->
                <div class="form-group">

                    <label for="MatKhauMoi">
                        Mật khẩu mới
                    </label>

                    <div class="password-wrapper">

                        <input
                                type="password"
                                id="MatKhauMoi"
                                placeholder="Nhập mật khẩu mới"
                                autocomplete="new-password"
                                required>

                        <button
                                type="button"
                                id="toggleNewPassword"
                                class="toggle-password">

                            <svg
                                    id="newPasswordIcon"
                                    viewBox="0 0 24 24">

                                <!-- Mắt có mí: mật khẩu đang bị ẩn -->
                                <path
                                        d="M5 12
                           C7 14.5, 9.5 15.5, 12 15.5
                           C14.5 15.5, 17 14.5, 19 12"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                />

                                <path
                                        d="M7 14 L6 15.5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.5"
                                        stroke-linecap="round"
                                />

                                <path
                                        d="M17 14 L18 15.5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.5"
                                        stroke-linecap="round"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- ==========================
                     QUY TẮC MẬT KHẨU
                =========================== -->

                <div class="password-rules">

                    <div class="rules-title">
                        Mật khẩu phải đáp ứng:
                    </div>


                    <div
                            id="ruleLength"
                            class="password-rule">

                        <span class="rule-icon">
                            ✕
                        </span>

                        <span>
                            Ít nhất 8 ký tự
                        </span>

                    </div>


                    <div
                            id="ruleUppercase"
                            class="password-rule">

                        <span class="rule-icon">
                            ✕
                        </span>

                        <span>
                            Có ít nhất 1 ký tự in hoa (A-Z)
                        </span>

                    </div>


                    <div
                            id="ruleLowercase"
                            class="password-rule">

                        <span class="rule-icon">
                            ✕
                        </span>

                        <span>
                            Có ít nhất 1 ký tự in thường (a-z)
                        </span>

                    </div>


                    <div
                            id="ruleNumber"
                            class="password-rule">

                        <span class="rule-icon">
                            ✕
                        </span>

                        <span>
                            Có ít nhất 1 chữ số (0-9)
                        </span>

                    </div>

                </div>


                <!-- ==========================
                     XÁC NHẬN MẬT KHẨU
                =========================== -->

                <div class="form-group confirm-group">

                    <label for="MatKhauXacNhan">
                        Xác nhận mật khẩu mới
                    </label>

                    <div class="password-wrapper">

                        <input
                                type="password"
                                id="MatKhauXacNhan"
                                placeholder="Nhập lại mật khẩu mới"
                                autocomplete="new-password"
                                required>

                        <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="toggle-password">

                            <svg
                                    id="confirmPasswordIcon"
                                    viewBox="0 0 24 24">

                                <!-- Mắt có mí: mật khẩu đang bị ẩn -->
                                <path
                                        d="M5 12
                           C7 14.5, 9.5 15.5, 12 15.5
                           C14.5 15.5, 17 14.5, 19 12"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                />

                                <path
                                        d="M7 14 L6 15.5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.5"
                                        stroke-linecap="round"
                                />

                                <path
                                        d="M17 14 L18 15.5"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.5"
                                        stroke-linecap="round"
                                />

                            </svg>

                        </button>

                    </div>

                    <div id="ruleMatch" class="password-rule">

                        <span class="rule-icon">✕</span>

                        <span>Xác nhận mật khẩu khớp</span>

                    </div>

                </div>

                <!-- ==========================
                     MESSAGE
                =========================== -->

                <div
                        id="resetMessage"
                        class="message">
                </div>


                <!-- ==========================
                     RESET BUTTON
                =========================== -->

                <button
                        type="submit"
                        id="resetButton"
                        disabled>

                    Đặt lại mật khẩu

                </button>

            </form>


            <!-- ==========================
                 QUAY LẠI
            =========================== -->

            <a
                    href="/auth/login"
                    class="back-login">

                ← Quay lại đăng nhập

            </a>

        </div>

    </div>

</div>


<script src="/Js/Auth/reset-password.js"></script>

</body>

</html>
