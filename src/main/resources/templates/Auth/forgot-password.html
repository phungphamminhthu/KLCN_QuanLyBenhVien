<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu - MedCare Hospital</title>

    <link rel="stylesheet"
          href="/Css/Auth/forgot-password.css">

</head>

<body>

<div class="page-container">

    <!-- =========================
         KHUNG NGOÀI DUY NHẤT
         ========================= -->

    <div class="auth-wrapper">

        <!-- =========================
             BRAND
             ========================= -->

        <div class="brand">

            <div class="brand-icon">
                +
            </div>

            <div class="brand-text">

                <strong>
                    MedCare Hospital
                </strong>

                <span>
                    HỆ THỐNG QUẢN LÝ BỆNH VIỆN
                </span>

            </div>

        </div>


        <!-- =========================
             FORM
             ========================= -->

        <div class="forgot-card">

            <div class="icon">
                🔒
            </div>


            <h1>
                Quên mật khẩu?
            </h1>


            <p class="description">
                Nhập email đã đăng ký để nhận mã OTP
                đặt lại mật khẩu.
            </p>


            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="Email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="Email"
                            placeholder="Nhập email của bạn"
                            autocomplete="email"
                            required>

                </div>


                <div id="message"
                     class="message">
                </div>


                <button
                        type="submit"
                        id="submitButton">

                    Gửi mã OTP

                </button>

            </form>


            <a href="/auth/login"
               class="back-login">

                ← Quay lại đăng nhập

            </a>

        </div>

    </div>

</div>


<script src="/Js/Auth/forgot-password.js"></script>

</body>

</html>
