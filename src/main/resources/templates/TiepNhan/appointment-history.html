<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lịch sử lịch khám - BỆNH VIỆN ABC</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <link href="/Css/Auth/logout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/layout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/appointment-history.css" rel="stylesheet">
</head>

<body class="reception-layout appointment-history-page">

<!-- SIDEBAR DÙNG CHUNG -->
<aside th:replace="~{TiepNhan/fragments/sidebar :: sidebar('appointment-history')}"></aside>

<main class="main-wrapper reception-main">

    <!-- HEADER DÙNG CHUNG -->
    <header th:replace="~{TiepNhan/fragments/header :: header('refresh-history-button', 'Quản lý lịch sử khám bệnh')}"></header>

    <div class="page-content history-page-content">

        <!-- THÔNG BÁO -->
        <div id="history-message"
             class="alert alert-danger"
             role="status"
             aria-live="polite"
             hidden></div>

        <section id="history-card"
                 class="history-card"
                 aria-labelledby="history-title"
                 aria-busy="true">

            <!-- TIÊU ĐỀ VÀ CHỌN NGÀY -->
            <div class="history-card-heading">

                <div class="history-title-group">
                    <span class="history-title-icon"
                          aria-hidden="true">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </span>

                    <h1 id="history-title">
                        Lịch sử lịch khám
                    </h1>
                </div>

                <div class="history-date-field">
                    <div class="history-date-controls">

                        <!-- NGÀY TRƯỚC, NGÀY ĐANG CHỌN, NGÀY SAU -->
                        <div class="history-date-navigation btn-group"
                             role="group"
                             aria-label="Chuyển ngày khám">

                            <button id="history-previous-date"
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    title="Ngày trước"
                                    aria-label="Xem ngày trước"
                                    disabled>
                                <i class="fa-solid fa-chevron-left"
                                   aria-hidden="true"></i>
                            </button>

                            <span id="history-date-label"
                                  class="btn btn-outline-secondary"
                                  role="status"
                                  aria-live="polite"
                                  aria-atomic="true">
                                —
                            </span>

                            <button id="history-next-date"
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    title="Ngày sau"
                                    aria-label="Xem ngày sau"
                                    disabled>
                                <i class="fa-solid fa-chevron-right"
                                   aria-hidden="true"></i>
                            </button>

                        </div>

                        <!-- BIỂU TƯỢNG MỞ LỊCH -->
                        <div class="history-calendar-control">
                            <button id="history-open-calendar"
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    title="Chọn ngày khám"
                                    aria-label="Mở lịch chọn ngày khám"
                                    disabled>
                                <i class="fa-regular fa-calendar-days"
                                   aria-hidden="true"></i>
                            </button>

                            <input id="history-filter-date"
                                   type="date"
                                   min="1000-01-01"
                                   max="9999-12-31"
                                   tabindex="-1"
                                   aria-label="Ngày khám cần xem"
                                   disabled>
                        </div>

                    </div>
                </div>

            </div>

            <!-- TÌM KIẾM → BÁC SĨ → TRẠNG THÁI -->
            <form id="history-filter-form"
                  class="history-filter-bar"
                  role="search">

                <div class="history-search-group">
                    <label for="history-search-input"
                           class="visually-hidden">
                        Tìm theo mã lịch, mã bệnh nhân,
                        họ tên hoặc số điện thoại
                    </label>

                    <input id="history-search-input"
                           class="history-search-input"
                           type="search"
                           maxlength="255"
                           autocomplete="off"
                           placeholder="Mã lịch, mã BN, họ tên hoặc số điện thoại">

                    <button id="history-search-button"
                            class="history-search-button"
                            type="submit"
                            title="Tìm kiếm"
                            aria-label="Tìm kiếm lịch sử khám">
                        <i class="fa-solid fa-magnifying-glass"
                           aria-hidden="true"></i>
                    </button>
                </div>

                <div class="history-select-group">
                    <label for="history-doctor-filter"
                           class="visually-hidden">
                        Lọc theo bác sĩ
                    </label>

                    <select id="history-doctor-filter"
                            class="history-filter-select form-select">
                        <option value="">Tất cả bác sĩ</option>
                    </select>
                </div>

                <div class="history-select-group">
                    <label for="history-status-filter"
                           class="visually-hidden">
                        Lọc theo trạng thái lịch khám
                    </label>

                    <select id="history-status-filter"
                            class="history-filter-select form-select">
                        <option value="">Tất cả trạng thái</option>
                        <option value="ChoGoi">Chờ gọi</option>
                        <option value="DaGoi">Đã gọi</option>
                        <option value="DaTiepNhan">Đã tiếp nhận</option>
                        <option value="ChoKham">Chờ khám</option>
                        <option value="DangKham">Đang khám</option>
                        <option value="ChoThanhToan">Chờ thanh toán</option>
                        <option value="ChoCLS">Chờ CLS</option>
                        <option value="DangCLS">Đang CLS</option>
                        <option value="ChoLayThuoc">Chờ lấy thuốc</option>
                        <option value="DangLayThuoc">Đang lấy thuốc</option>
                        <option value="HoanTat">Hoàn tất</option>
                        <option value="DaHuy">Đã hủy</option>
                        <option value="KhongDen">Không đến</option>
                    </select>
                </div>

            </form>

            <!-- BẢNG DANH SÁCH -->
            <div class="history-table-area">

                <div class="history-table-scroll">
                    <table class="history-table">

                        <caption class="visually-hidden">
                            Danh sách lịch đăng ký khám theo ngày,
                            gồm tất cả trạng thái
                        </caption>

                        <colgroup>
                            <col class="history-col-index">
                            <col class="history-col-code">
                            <col class="history-col-patient">
                            <col class="history-col-date">
                            <col class="history-col-doctor">
                            <col class="history-col-room">
                            <col class="history-col-status">
                            <col class="history-col-detail">
                        </colgroup>

                        <thead>
                        <tr>
                            <th scope="col">STT</th>
                            <th scope="col">MÃ LỊCH</th>
                            <th scope="col">BỆNH NHÂN</th>
                            <th scope="col">NGÀY &amp; GIỜ KHÁM</th>
                            <th scope="col">KHOA &amp; BÁC SĨ</th>
                            <th scope="col">PHÒNG</th>
                            <th scope="col">TRẠNG THÁI</th>

                            <th scope="col">
                                <span class="visually-hidden">
                                    Xem chi tiết lịch khám
                                </span>
                            </th>
                        </tr>
                        </thead>

                        <tbody id="history-table-body"></tbody>

                    </table>
                </div>

                <!-- ĐANG TẢI -->
                <div id="history-loading"
                     class="history-state"
                     role="status"
                     aria-live="polite">

                    <span class="history-state-icon"
                          aria-hidden="true">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </span>

                    <p>Đang tải lịch sử lịch khám...</p>
                </div>

                <!-- KHÔNG CÓ DỮ LIỆU -->
                <div id="history-empty"
                     class="history-state"
                     role="status"
                     aria-live="polite"
                     hidden>

                    <span class="history-state-icon"
                          aria-hidden="true">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </span>

                    <p id="history-empty-message">
                        Không có lịch khám phù hợp
                        với ngày và bộ lọc đã chọn.
                    </p>
                </div>

            </div>

            <!-- PHÂN TRANG Ở CUỐI KHUNG -->
            <div class="history-pagination">

                <span id="history-record-count"
                      class="history-record-count"
                      role="status"
                      aria-live="polite">
                    Đang tải dữ liệu...
                </span>

                <div class="history-pagination-controls">

                    <label for="history-page-size"
                           class="visually-hidden">
                        Số lịch khám trên mỗi trang
                    </label>

                    <select id="history-page-size"
                            class="history-page-size">
                        <option value="10">10 / trang</option>
                        <option value="20" selected>20 / trang</option>
                        <option value="50">50 / trang</option>
                    </select>

                    <button id="history-prev-page"
                            class="history-page-button"
                            type="button"
                            title="Trang trước"
                            aria-label="Trang trước"
                            disabled>
                        <i class="fa-solid fa-chevron-left"
                           aria-hidden="true"></i>
                    </button>

                    <span id="history-page-label"
                          class="history-page-label"
                          aria-live="polite">
                        Trang 1 / 1
                    </span>

                    <button id="history-next-page"
                            class="history-page-button"
                            type="button"
                            title="Trang sau"
                            aria-label="Trang sau"
                            disabled>
                        <i class="fa-solid fa-chevron-right"
                           aria-hidden="true"></i>
                    </button>

                </div>
            </div>

        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Js/Auth/logout.js"></script>
<script src="/Js/TiepNhan/appointment-history.js"></script>

</body>
</html>
