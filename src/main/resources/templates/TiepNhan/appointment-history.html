
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử lịch khám - MedCare Hospital</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link href="/Css/Auth/logout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/layout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/appointment-history.css" rel="stylesheet">
</head>

<body class="reception-layout appointment-history-page">

<aside th:replace="~{TiepNhan/fragments/sidebar :: sidebar}"></aside>

<main class="main-wrapper reception-main">
    <header th:replace="~{TiepNhan/fragments/header :: header('refresh-history-button', 'Quản lý lịch sử khám bệnh')}"></header>

    <div class="page-content history-page-content">
        <div id="history-message"
             class="alert alert-danger"
             role="status"
             aria-live="polite"
             hidden></div>

        <section id="history-card" class="history-card" aria-labelledby="history-title" aria-busy="true">
            <!-- TIÊU ĐỀ + CHỌN NGÀY GIỐNG TRANG PATIENTS -->
            <div class="history-card-heading">
                <div class="history-title-group">
                    <span class="history-title-icon" aria-hidden="true">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </span>
                    <h1 id="history-title">Lịch sử lịch khám</h1>
                </div>

                <div class="history-date-controls" role="group" aria-label="Chọn ngày khám">
                    <div class="history-date-navigation" role="group" aria-label="Chuyển ngày">
                        <button id="history-prev-date" type="button" class="history-date-button"
                                title="Ngày trước" aria-label="Xem ngày trước">
                            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                        </button>
                        <span id="history-date-label" class="history-date-label" role="status" aria-live="polite">—/—/——</span>
                        <button id="history-next-date" type="button" class="history-date-button"
                                title="Ngày sau" aria-label="Xem ngày sau">
                            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="history-calendar-control">
                        <button id="history-open-calendar" type="button" class="history-date-button history-calendar-button"
                                title="Chọn ngày" aria-label="Mở lịch chọn ngày">
                            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                        </button>
                        <input id="history-filter-date" class="history-date-picker" type="date"
                               min="1000-01-01" max="9999-12-31" tabindex="-1"
                               aria-label="Ngày khám được chọn">
                    </div>
                </div>
            </div>

            <!-- TÌM KIẾM, BÁC SĨ, PHÒNG -->
            <form id="history-filter-form" class="history-filter-bar" role="search">
                <div class="history-search-group">
                    <label for="history-search-input" class="visually-hidden">
                        Tìm mã lịch, mã bệnh nhân, họ tên hoặc số điện thoại
                    </label>
                    <input id="history-search-input" class="history-search-input" type="search"
                           maxlength="100" autocomplete="off"
                           placeholder="Mã lịch, mã BN, họ tên hoặc số điện thoại">
                    <button id="history-search-button" class="history-search-button" type="submit"
                            title="Tìm kiếm" aria-label="Tìm lịch sử khám">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="history-select-group">
                    <label for="history-doctor-filter" class="visually-hidden">Bác sĩ</label>
                    <select id="history-doctor-filter" class="history-filter-select" aria-label="Lọc theo bác sĩ" disabled>
                        <option value="">Tất cả bác sĩ</option>
                    </select>
                </div>

                <div class="history-select-group">
                    <label for="history-room-filter" class="visually-hidden">Phòng khám</label>
                    <select id="history-room-filter" class="history-filter-select" aria-label="Lọc theo phòng khám" disabled>
                        <option value="">Tất cả phòng</option>
                    </select>
                </div>
            </form>

            <!-- DANH SÁCH LỊCH SỬ -->
            <div class="history-table-area">
                <div class="history-table-scroll">
                    <table class="history-table">
                        <caption class="visually-hidden">Danh sách lịch khám đã hoàn tất trong ngày được chọn</caption>
                        <colgroup>
                            <col class="history-col-index">
                            <col class="history-col-code">
                            <col class="history-col-patient">
                            <col class="history-col-date">
                            <col class="history-col-doctor">
                            <col class="history-col-room">
                            <col class="history-col-status">
                            <col class="history-col-detail">
                        </colgroup>
                        <thead>
                        <tr>
                            <th scope="col">STT</th>
                            <th scope="col">MÃ LỊCH</th>
                            <th scope="col">BỆNH NHÂN</th>
                            <th scope="col">NGÀY &amp; GIỜ KHÁM</th>
                            <th scope="col">KHOA &amp; BÁC SĨ</th>
                            <th scope="col">PHÒNG</th>
                            <th scope="col">TRẠNG THÁI</th>
                            <th scope="col"><span class="visually-hidden">Xem hồ sơ lịch khám</span></th>
                        </tr>
                        </thead>
                        <tbody id="history-table-body"></tbody>
                    </table>
                </div>

                <div id="history-loading" class="history-state" role="status" aria-live="polite">
                    <span class="history-state-icon" aria-hidden="true">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </span>
                    <p>Đang tải lịch sử lịch khám...</p>
                </div>

                <div id="history-empty" class="history-state" role="status" aria-live="polite" hidden>
                    <span class="history-state-icon" aria-hidden="true">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </span>
                    <p id="history-empty-message">Không có lịch khám đã hoàn tất trong ngày này.</p>
                </div>
            </div>

            <!-- CHÂN BẢNG GIỐNG PATIENTS -->
            <div class="history-pagination">
                <span id="history-record-count" class="history-record-count" role="status" aria-live="polite">
                    Đang tải dữ liệu...
                </span>
                <div class="history-pagination-controls">
                    <label for="history-page-size" class="visually-hidden">Số lịch khám trên mỗi trang</label>
                    <select id="history-page-size" class="history-page-size" aria-label="Số lịch khám trên mỗi trang" disabled>
                        <option value="5" selected>5 / trang</option>
                        <option value="10">10 / trang</option>
                        <option value="20">20 / trang</option>
                        <option value="50">50 / trang</option>
                    </select>
                    <button id="history-prev-page" class="history-page-button" type="button"
                            title="Trang trước" aria-label="Trang trước" disabled>
                        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                    </button>
                    <span id="history-page-label" class="history-page-label" aria-live="polite">Trang 0 / 0</span>
                    <button id="history-next-page" class="history-page-button" type="button"
                            title="Trang tiếp" aria-label="Trang tiếp" disabled>
                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Js/Auth/logout.js"></script>
<script th:src="@{/Js/TiepNhan/layout.js}"></script>
<script src="/Js/TiepNhan/appointment-history.js"></script>
</body>
</html>
