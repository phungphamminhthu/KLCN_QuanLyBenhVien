<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hồ sơ cá nhân - BỆNH VIỆN ABC</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <link href="/Css/Auth/logout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/layout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/profile.css" rel="stylesheet">
</head>

<body class="reception-layout staff-profile-page">

<!-- SIDEBAR DÙNG CHUNG -->
<aside th:replace="~{TiepNhan/fragments/sidebar :: sidebar('profile')}">
</aside>

<main class="main-wrapper reception-main">

    <!-- HEADER DÙNG CHUNG -->
    <header th:replace="~{TiepNhan/fragments/header :: header('refresh-profile-button', 'Quản lý hồ sơ cá nhân')}">
    </header>

    <div id="staff-profile-page"
         class="page-content staff-profile-content">

        <!-- THÔNG BÁO ĐẨY -->
        <div id="staff-profile-message"
             class="staff-profile-toast"
             role="status"
             aria-live="polite"
             aria-atomic="true"
             hidden>

            <i id="staff-profile-message-icon"
               class="fa-solid fa-circle-info"
               aria-hidden="true"></i>

            <span id="staff-profile-message-text"></span>

            <button id="staff-profile-message-close"
                    type="button"
                    aria-label="Đóng thông báo">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>

        <!-- THẺ ĐẠI DIỆN -->
        <section class="staff-summary-card"
                 aria-labelledby="staff-display-name">

            <div id="staff-avatar"
                 class="staff-avatar"
                 role="img"
                 aria-label="Ảnh đại diện nhân viên">

                <img id="staff-avatar-image"
                     alt=""
                     hidden>

                <i id="staff-avatar-placeholder"
                   class="fa-solid fa-user"
                   aria-hidden="true"></i>
            </div>

            <div class="staff-summary-info">
                <span class="staff-role-badge">
                    <i class="fa-solid fa-user-nurse"
                       aria-hidden="true"></i>
                    Nhân viên tiếp nhận
                </span>

                <h1 id="staff-display-name">Chưa tải thông tin</h1>

                <p class="staff-summary-code">
                    Mã nhân viên:
                    <span id="staff-summary-id">—</span>
                </p>

                <p class="staff-summary-department">
                    <i class="fa-solid fa-hospital"
                       aria-hidden="true"></i>

                    <span id="staff-summary-department">
                        Chưa tải khoa phụ trách
                    </span>
                </p>
            </div>
        </section>

        <!-- HAI BẢNG THÔNG TIN -->
        <div class="staff-profile-grid">

            <!-- THÔNG TIN CÁ NHÂN -->
            <section class="staff-info-card"
                     aria-labelledby="staff-personal-title">

                <div class="staff-card-heading">
                    <div>
                        <h2 id="staff-personal-title">
                            <i class="fa-regular fa-id-card"
                               aria-hidden="true"></i>
                            Thông tin cá nhân
                        </h2>

                        <p>Thông tin liên hệ và tài khoản</p>
                    </div>

                    <button id="staff-edit-button"
                            type="button"
                            class="staff-button staff-button-primary"
                            disabled>
                        <i class="fa-solid fa-pen"
                           aria-hidden="true"></i>
                        Chỉnh sửa
                    </button>
                </div>

                <form id="staff-profile-form">

                    <fieldset id="staff-personal-fields"
                              class="staff-fields"
                              disabled>

                        <div class="staff-form-grid">

                            <div class="staff-field">
                                <label for="staff-full-name">
                                    Họ và tên
                                    <span class="staff-required">*</span>
                                </label>

                                <input id="staff-full-name"
                                       name="hoTen"
                                       type="text"
                                       class="form-control"
                                       maxlength="255"
                                       autocomplete="name"
                                       required
                                       readonly>
                            </div>

                            <div class="staff-field">
                                <label for="staff-username">
                                    Tên đăng nhập
                                </label>

                                <input id="staff-username"
                                       type="text"
                                       class="form-control"
                                       autocomplete="username"
                                       readonly>
                            </div>

                            <div class="staff-field">
                                <label for="staff-email">Email</label>

                                <input id="staff-email"
                                       name="email"
                                       type="email"
                                       class="form-control"
                                       maxlength="255"
                                       autocomplete="email"
                                       readonly>
                            </div>

                            <div class="staff-field">
                                <label for="staff-phone">
                                    Số điện thoại
                                </label>

                                <input id="staff-phone"
                                       name="soDienThoai"
                                       type="tel"
                                       class="form-control"
                                       maxlength="15"
                                       autocomplete="tel"
                                       readonly>
                            </div>

                        </div>
                    </fieldset>

                    <!-- CHỈ HIỆN KHI CHỈNH SỬA -->
                    <div id="staff-edit-actions"
                         class="staff-form-actions"
                         hidden>

                        <button id="staff-cancel-button"
                                type="button"
                                class="staff-button staff-button-secondary">
                            Hủy
                        </button>

                        <button id="staff-save-button"
                                type="submit"
                                class="staff-button staff-button-primary"
                                disabled>
                            <i class="fa-regular fa-floppy-disk"
                               aria-hidden="true"></i>
                            Lưu thay đổi
                        </button>
                    </div>

                </form>
            </section>

            <!-- THÔNG TIN CÔNG TÁC -->
            <section class="staff-info-card"
                     aria-labelledby="staff-work-title">

                <div class="staff-card-heading">
                    <div>
                        <h2 id="staff-work-title">
                            <i class="fa-solid fa-briefcase"
                               aria-hidden="true"></i>
                            Thông tin công tác
                        </h2>

                        <p>Phân công khoa và ca trực hiện tại</p>
                    </div>
                </div>

                <div class="staff-form-grid">

                    <div class="staff-field">
                        <label for="staff-work-id">
                            Mã nhân viên
                        </label>

                        <input id="staff-work-id"
                               type="text"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="staff-field">
                        <label for="staff-work-role">Vai trò</label>

                        <input id="staff-work-role"
                               type="text"
                               class="form-control"
                               value="Nhân viên tiếp nhận"
                               readonly>
                    </div>

                    <div class="staff-field">
                        <label for="staff-department">
                            Khoa phụ trách
                        </label>

                        <input id="staff-department"
                               type="text"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="staff-field">
                        <label for="staff-assignment-id">
                            Mã phân công
                        </label>

                        <input id="staff-assignment-id"
                               type="text"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="staff-field">
                        <label for="staff-shift-start">
                            Bắt đầu ca
                        </label>

                        <input id="staff-shift-start"
                               type="text"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="staff-field">
                        <label for="staff-shift-end">
                            Kết thúc ca
                        </label>

                        <input id="staff-shift-end"
                               type="text"
                               class="form-control"
                               readonly>
                    </div>

                </div>

                <p id="staff-assignment-message"
                   class="staff-assignment-message"
                   role="status"
                   hidden></p>
            </section>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Js/Auth/logout.js"></script>
<script src="/Js/TiepNhan/profile.js"></script>

</body>
</html>
