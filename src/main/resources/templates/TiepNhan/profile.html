
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{TiepNhan/fragments/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Nhân viên tiếp nhận</title>

    <!-- CSS DÙNG CHUNG -->
    <link rel="stylesheet"
          th:href="@{/Css/TiepNhan/layout.css}">

    <!-- CSS ĐĂNG XUẤT -->
    <link rel="stylesheet"
          th:href="@{/Css/Auth/logout.css}">

    <!-- CSS RIÊNG TRANG HỒ SƠ CÁ NHÂN -->
    <th:block layout:fragment="css">
        <link rel="stylesheet"
              th:href="@{/Css/TiepNhan/profile.css}">
    </th:block>
</head>

<body>

<div layout:fragment="content">

    <div class="profile-container">

        <!-- Tiêu đề trang -->
        <div class="page-header">
            <div>
                <h1>Hồ sơ cá nhân</h1>
                <p>Quản lý thông tin cá nhân và tài khoản của bạn.</p>
            </div>
        </div>

        <!-- Thông tin tổng quan -->
        <section class="profile-summary">
            <div class="profile-avatar">
                <img id="avatar"
                     src="/Images/default-avatar.jpg"
                     alt="Ảnh đại diện"
                     onerror="this.onerror=null; this.src='/Images/default-avatar.jpg';">

                <button type="button"
                        id="changeAvatarBtn"
                        class="btn-change-avatar"
                        title="Thay đổi ảnh đại diện">
                    <i class="fa-solid fa-camera"></i>
                </button>

                <input type="file"
                       id="avatarInput"
                       accept="image/*"
                       hidden>
            </div>

            <div class="profile-summary-info">
                <h2 id="displayName">Nhân viên tiếp nhận</h2>
                <p id="displayUsername">Tên đăng nhập</p>

                <span class="profile-role">
                    <i class="fa-solid fa-user-nurse"></i>
                    Nhân viên tiếp nhận
                </span>
            </div>
        </section>

        <!-- Thông tin cá nhân -->
        <section class="profile-card">

            <div class="section-header">
                <div>
                    <h2>Thông tin cá nhân</h2>
                    <p>Thông tin tài khoản và liên hệ của bạn.</p>
                </div>

                <button type="button"
                        id="editBtn"
                        class="btn-primary">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Chỉnh sửa
                </button>
            </div>

            <form id="profileForm">

                <div class="profile-grid">

                    <div class="form-group">
                        <label for="hoTen">Họ và tên</label>
                        <input type="text"
                               id="hoTen"
                               name="hoTen"
                               placeholder="Nhập họ và tên"
                               disabled>
                    </div>

                    <div class="form-group">
                        <label for="tenDangNhap">Tên đăng nhập</label>
                        <input type="text"
                               id="tenDangNhap"
                               name="tenDangNhap"
                               placeholder="Tên đăng nhập"
                               disabled>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Nhập địa chỉ email"
                               disabled>
                    </div>

                    <div class="form-group">
                        <label for="soDienThoai">Số điện thoại</label>
                        <input type="tel"
                               id="soDienThoai"
                               name="soDienThoai"
                               placeholder="Nhập số điện thoại"
                               disabled>
                    </div>

                    <div class="form-group">
                        <label for="tenKhoa">Khoa / Bộ phận</label>
                        <input type="text"
                               id="tenKhoa"
                               name="tenKhoa"
                               placeholder="Khoa hoặc bộ phận công tác"
                               disabled>
                    </div>

                    <div class="form-group">
                        <label for="viTriCongViec">Vị trí công việc</label>
                        <input type="text"
                               id="viTriCongViec"
                               name="viTriCongViec"
                               value="Nhân viên tiếp nhận"
                               disabled>
                    </div>

                </div>

                <!-- Nút thao tác khi chỉnh sửa -->
                <div id="editActions"
                     class="form-actions"
                     style="display: none;">

                    <button type="button"
                            id="cancelBtn"
                            class="btn-secondary">
                        Hủy
                    </button>

                    <button type="submit"
                            id="saveBtn"
                            class="btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Lưu thay đổi
                    </button>
                </div>

            </form>
        </section>

        <!-- Bảo mật tài khoản -->
        <section class="profile-card security-card">

            <div class="section-header">
                <div>
                    <h2>Bảo mật tài khoản</h2>
                    <p>Thay đổi mật khẩu để bảo vệ tài khoản của bạn.</p>
                </div>

                <button type="button"
                        id="openPasswordBtn"
                        class="btn-secondary">
                    <i class="fa-solid fa-lock"></i>
                    Đổi mật khẩu
                </button>
            </div>

        </section>

    </div>

    <!-- Modal đổi mật khẩu -->
    <div class="modal fade"
         id="passwordModal"
         tabindex="-1"
         aria-labelledby="passwordModalLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="passwordModalLabel">
                        Đổi mật khẩu
                    </h5>

                    <button type="button"
                            class="btn-close"
                            id="closePasswordBtn"
                            aria-label="Đóng">
                    </button>
                </div>

                <form id="passwordForm">

                    <div class="modal-body">

                        <div class="form-group">
                            <label for="matKhauCu">Mật khẩu hiện tại</label>
                            <input type="password"
                                   id="matKhauCu"
                                   name="matKhauCu"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="matKhauMoi">Mật khẩu mới</label>
                            <input type="password"
                                   id="matKhauMoi"
                                   name="matKhauMoi"
                                   autocomplete="new-password"
                                   minlength="8"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="xacNhanMatKhau">
                                Xác nhận mật khẩu mới
                            </label>
                            <input type="password"
                                   id="xacNhanMatKhau"
                                   name="xacNhanMatKhau"
                                   autocomplete="new-password"
                                   minlength="8"
                                   required>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button"
                                id="cancelPasswordBtn"
                                class="btn-secondary">
                            Hủy
                        </button>

                        <button type="submit"
                                id="submitPasswordBtn"
                                class="btn-primary">
                            Cập nhật mật khẩu
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>

<!-- JS DÙNG CHUNG -->
<script th:src="@{/Js/TiepNhan/layout.js}"></script>

<!-- JS ĐĂNG XUẤT -->
<script th:src="@{/Js/Auth/logout.js}"></script>
<!-- JavaScript riêng của trang hồ sơ cá nhân -->
<th:block layout:fragment="js">
    <script th:src="@{/Js/TiepNhan/profile.js}"></script>
</th:block>

</body>
</html>
