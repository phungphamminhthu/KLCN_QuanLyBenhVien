<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar reception-sidebar"
       th:fragment="sidebar">

    <!-- LOGO -->
    <div class="sidebar-logo">
        <div class="logo-icon">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </div>

        <div class="logo-text">
            <strong>MedCare Hospital</strong>
            <span>Hệ thống quản lý bệnh viện</span>
        </div>
    </div>

    <!-- MENU -->
    <nav class="sidebar-menu"
         aria-label="Menu nhân viên tiếp nhận">

        <a href="/TiepNhan/dashboard" class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                </span>
                Dashboard
            </span>
        </a>

        <a href="/TiepNhan/checkin" class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-calendar-day" aria-hidden="true"></i>
                </span>
                Lịch khám trong ngày
            </span>
        </a>

        <a href="/TiepNhan/appointment-history" class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
                </span>
                Lịch sử lịch khám
            </span>
        </a>

        <a href="/TiepNhan/patients" class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-address-book" aria-hidden="true"></i>
                </span>
                Bệnh nhân
            </span>
        </a>

        <!-- Lịch làm việc -->
        <a href="/TiepNhan/lich-lam-viec"
           class="menu-link"
           th:classappend="${activePage == 'lich-lam-viec'} ? ' active' : ''">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-calendar-week"
                       aria-hidden="true"></i>
                </span>
                Lịch làm việc
            </span>
        </a>

        <a href="/TiepNhan/profile" class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-regular fa-user" aria-hidden="true"></i>
                </span>
                Hồ sơ cá nhân
            </span>
        </a>

    </nav>

    <!-- ĐĂNG XUẤT: DÙNG CHUNG LOGOUT.JS -->
    <div class="sidebar-logout">
        <button type="button"
                id="logoutButton"
                class="logout-button">

            <i class="fa-solid fa-arrow-right-from-bracket"
               aria-hidden="true"></i>

            <span>Đăng xuất</span>
        </button>
    </div>

</aside>

</body>
</html>
