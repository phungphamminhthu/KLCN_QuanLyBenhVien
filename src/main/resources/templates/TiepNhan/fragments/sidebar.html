<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar reception-sidebar"
       th:fragment="sidebar(activePage)">

    <div class="sidebar-top">

        <!-- TÊN VÀ BIỂU TƯỢNG BỆNH VIỆN -->
        <div class="brand-section">

            <div class="brand-logo-icon">
                <i class="fa-solid fa-plus"
                   aria-hidden="true"></i>
            </div>

            <div>
                <h6 class="brand-title">
                    BỆNH VIỆN ABC
                </h6>

                <p class="brand-sub">
                    Vì sức khỏe cộng đồng
                </p>
            </div>

        </div>

        <!-- MENU DÙNG CHUNG -->
        <nav class="sidebar-menu"
             aria-label="Menu nhân viên tiếp nhận">

            <a href="/TiepNhan/dashboard"
               class="nav-item-main"
               th:classappend="${activePage == 'dashboard'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'dashboard' ? 'page' : null}">

                <i class="fa-solid fa-house"
                   aria-hidden="true"></i>

                <span>Dashboard</span>
            </a>

            <a href="/TiepNhan/checkin"
               class="nav-item-main"
               th:classappend="${activePage == 'checkin'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'checkin' ? 'page' : null}">

                <i class="fa-solid fa-calendar-day"
                   aria-hidden="true"></i>

                <span>Lịch khám trong ngày</span>
            </a>

            <a href="/TiepNhan/appointment-history"
               class="nav-item-main"
               th:classappend="${activePage == 'appointment-history'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'appointment-history' ? 'page' : null}">

                <i class="fa-solid fa-clock-rotate-left"
                   aria-hidden="true"></i>

                <span>Lịch sử lịch khám</span>
            </a>

            <a href="/TiepNhan/patients"
               class="nav-item-main"
               th:classappend="${activePage == 'patients'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'patients' ? 'page' : null}">

                <i class="fa-solid fa-address-book"
                   aria-hidden="true"></i>

                <span>Bệnh nhân</span>
            </a>

            <a href="/TiepNhan/profile"
               class="nav-item-main"
               th:classappend="${activePage == 'profile'} ? 'active' : ''"
               th:attr="aria-current=${activePage == 'profile' ? 'page' : null}">

                <i class="fa-regular fa-user"
                   aria-hidden="true"></i>

                <span>Hồ sơ cá nhân</span>
            </a>

        </nav>

    </div>

    <!-- ĐĂNG XUẤT -->
    <div class="sidebar-logout">

        <a href="/auth/login"
           id="logoutButton">

            <i class="fa-solid fa-arrow-right-from-bracket"
               aria-hidden="true"></i>

            <span>Đăng xuất</span>
        </a>

    </div>

</aside>

</body>
</html>
