<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="top-header reception-header"
        th:fragment="header(refreshButtonId, roleDescription)">

    <link rel="stylesheet" th:href="@{/Css/TiepNhan/notification.css}">

    <!-- BÊN TRÁI: NGÀY VÀ LÀM MỚI -->
    <div class="header-actions">

        <div class="btn-header header-date">
            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
            <span id="header-date-display">Đang cập nhật ngày...</span>
        </div>

        <button th:id="${refreshButtonId}"
                type="button"
                class="btn-header header-refresh"
                aria-label="Làm mới dữ liệu"
                title="Làm mới dữ liệu">
            <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
            <span>Làm mới dữ liệu</span>
        </button>

    </div>

    <!-- BÊN PHẢI -->
    <div class="header-right">


        <!-- CHUÔNG THÔNG BÁO -->
        <div id="notification-wrapper" class="notification-wrapper">

            <button type="button"
                    class="notification-button"
                    id="notification-button"
                    aria-label="Mở thông báo"
                    aria-expanded="false"
                    aria-controls="notification-panel">

                <i class="fa-solid fa-bell notification-icon"
                   aria-hidden="true"></i>

                <span id="notificationBadge"
                      class="notification-badge"
                      hidden>0</span>
            </button>

            <section id="notification-panel"
                     class="notification-panel"
                     aria-labelledby="notification-title"
                     hidden>

                <div class="notification-panel-header">
                    <div>
                        <h3 id="notification-title"
                            class="notification-panel-title">
                            Thông báo
                        </h3>

                        <small id="notificationCountText">
                            0 thông báo mới
                        </small>
                    </div>

                    <button type="button"
                            id="notification-close"
                            aria-label="Đóng thông báo">
                        <i class="fa-solid fa-xmark"
                           aria-hidden="true"></i>
                    </button>
                </div>

                <div class="notification-panel-body">
                    <div class="notification-empty">
                        <i class="fa-regular fa-bell"
                           aria-hidden="true"></i>
                        <p>Chưa có thông báo để hiển thị.</p>
                    </div>
                </div>

                <div class="notification-panel-footer">
                    <a href="/TiepNhan/notifications">
                        Xem tất cả thông báo
                    </a>
                </div>

            </section>
        </div>

        <!-- THÔNG TIN NHÂN VIÊN -->
        <div class="user-profile">

            <div class="user-avatar">
                <img id="current-user-avatar"
                     src="/Images/default-avatar.jpg"
                     alt="Ảnh đại diện nhân viên">
            </div>

            <div class="user-info">
                <div id="current-user-name" class="user-name">
                    Nhân viên tiếp nhận
                </div>

                <div id="current-user-email" class="user-email">
                    Chưa cập nhật email
                </div>

                <small id="current-user-role"
                       class="user-role"
                       th:text="${roleDescription}">
                    Nhân viên tiếp nhận
                </small>
            </div>

<!--            <div class="user-avatar">-->
<!--                <img id="current-user-avatar"-->
<!--                     src="/Images/default-avatar.jpg"-->
<!--                     alt="Ảnh đại diện nhân viên">-->
<!--            </div>-->

        </div>

    </div>

    <!-- STOMP WebSocket -->
    <script defer
            src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js">
    </script>

    <!-- Chuông thông báo nhân viên tiếp nhận -->
    <script defer
            src="/Js/TiepNhan/tiepnhan-notification.js?v=1">
    </script>

</header>

</body>
</html>
