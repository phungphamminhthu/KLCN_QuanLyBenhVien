<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar reception-header"
        th:fragment="header(refreshButtonId, roleDescription)">

    <!-- NGÀY THÁNG VÀ NÚT LÀM MỚI -->
    <div class="header-actions flex-nowrap">

        <div class="btn-header header-date text-nowrap">
            <i class="fa-regular fa-calendar"
               aria-hidden="true"></i>

            <span id="header-date-display">
                Đang cập nhật ngày...
            </span>
        </div>

        <button th:id="${refreshButtonId}"
                type="button"
                class="btn-header header-refresh text-nowrap"
                aria-label="Làm mới dữ liệu"
                title="Làm mới dữ liệu">

            <i class="fa-solid fa-arrows-rotate"
               aria-hidden="true"></i>

            <span>Làm mới dữ liệu</span>
        </button>

    </div>

    <!-- THÔNG BÁO VÀ THÔNG TIN NHÂN VIÊN -->
    <div class="topbar-actions">

        <div id="notification-wrapper"
             class="notification-wrapper">

            <button id="notification-button"
                    type="button"
                    class="notification-button"
                    aria-label="Mở thông báo"
                    aria-expanded="false"
                    aria-controls="notification-panel">

                <i class="fa-solid fa-bell"
                   aria-hidden="true"></i>

                <span id="notification-dot"
                      class="notification-dot"
                      hidden
                      aria-hidden="true"></span>
            </button>

            <section id="notification-panel"
                     class="notification-panel"
                     aria-labelledby="notification-title"
                     hidden>

                <div class="notification-header">

                    <h2 id="notification-title"
                        class="notification-title">
                        Thông báo
                    </h2>

                    <button id="notification-close"
                            type="button"
                            class="notification-close"
                            aria-label="Đóng thông báo">

                        <i class="fa-solid fa-xmark"
                           aria-hidden="true"></i>
                    </button>

                </div>

                <div id="notification-list"
                     class="notification-list">

                    <div class="notification-empty">
                        <i class="fa-regular fa-bell"
                           aria-hidden="true"></i>

                        Chưa có thông báo để hiển thị.
                    </div>

                </div>

            </section>

        </div>

        <div class="user-profile">

            <div class="user-info">

                <div id="current-user-name"
                     class="user-name">
                    Nhân viên tiếp nhận
                </div>

                <small class="user-role"
                       th:text="${roleDescription}">
                    Quản lý lịch khám trong ngày
                </small>

            </div>

            <div id="current-user-avatar"
                 class="user-avatar"
                 role="img"
                 aria-label="Ảnh đại diện người dùng">

                <i class="fa-regular fa-user"
                   aria-hidden="true"></i>

            </div>

        </div>

    </div>

</header>

</body>
</html>
