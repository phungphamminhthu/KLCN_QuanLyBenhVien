<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hồ sơ bệnh nhân - BỆNH VIỆN ABC</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <link href="/Css/Auth/logout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/layout.css" rel="stylesheet">
    <link href="/Css/TiepNhan/patient-detail.css" rel="stylesheet">
</head>

<body class="reception-layout patient-detail-page">

<!-- SIDEBAR DÙNG CHUNG -->
<aside th:replace="~{TiepNhan/fragments/sidebar :: sidebar(${trangNguon})}"></aside>

<main id="patient-detail-page"
      class="main-wrapper reception-main"
      th:attr="data-patient-id=${maBenhNhan},
               data-appointment-id=${maLichKham},
               data-source=${trangNguon}">

    <!-- HEADER DÙNG CHUNG -->
    <header th:replace="~{TiepNhan/fragments/header :: header('refresh-patient-detail-button', 'Quản lý hồ sơ bệnh nhân')}"></header>

    <!-- THÔNG BÁO KẾT QUẢ LƯU -->
    <div id="patient-detail-save-toast"
         class="patient-detail-toast"
         role="status"
         aria-live="polite"
         aria-atomic="true"
         hidden>

        <span class="patient-detail-toast-icon" aria-hidden="true">
            <i id="patient-detail-save-toast-icon"
               class="fa-solid fa-circle-check"></i>
        </span>

        <span id="patient-detail-save-toast-text"
              class="patient-detail-toast-text"></span>

        <button id="patient-detail-save-toast-close"
                class="patient-detail-toast-close"
                type="button"
                aria-label="Đóng thông báo">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>

    <!-- THÔNG BÁO KHI RỜI TRANG MÀ CHƯA LƯU -->
    <section id="patient-detail-leave-toast"
             class="patient-detail-toast patient-detail-leave-toast is-warning"
             role="alertdialog"
             aria-modal="false"
             aria-labelledby="patient-detail-leave-title"
             aria-describedby="patient-detail-leave-text"
             hidden>

        <span class="patient-detail-toast-icon" aria-hidden="true">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </span>

        <div class="patient-detail-toast-body">
            <strong id="patient-detail-leave-title">
                Thay đổi chưa được lưu
            </strong>

            <p id="patient-detail-leave-text"
               class="patient-detail-toast-text"></p>

            <div class="patient-detail-toast-actions">
                <button id="patient-detail-stay"
                        type="button"
                        class="btn btn-outline-secondary btn-sm">
                    Ở lại
                </button>

                <button id="patient-detail-discard"
                        type="button"
                        class="btn btn-warning btn-sm">
                    Bỏ thay đổi
                </button>
            </div>
        </div>

        <button id="patient-detail-leave-close"
                type="button"
                class="patient-detail-toast-close"
                aria-label="Đóng và tiếp tục chỉnh sửa">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </section>

    <div id="patient-detail-content"
         class="page-content patient-detail-content">

        <!-- TIÊU ĐỀ -->
        <div class="patient-detail-heading">
            <div class="patient-detail-heading-left">

                <div id="patient-detail-back-slot"
                     class="patient-detail-back-slot">

                    <a id="patient-detail-back"
                       class="patient-detail-back"
                       href="/TiepNhan/checkin"
                       th:href="${duongDanQuayLai}"
                       aria-label="Quay lại danh sách"
                       title="Quay lại danh sách">

                        <i class="fa-solid fa-arrow-left"
                           aria-hidden="true"></i>

                        <span id="patient-detail-back-label">
                            Quay lại
                        </span>
                    </a>
                </div>

                <div class="patient-detail-title-group">
                    <h1>Hồ sơ bệnh nhân</h1>

                    <div class="patient-detail-subtitle">
                        <span id="profile-patient-code">—</span>
                        <span aria-hidden="true">·</span>
                        <span id="profile-patient-heading">
                            Đang tải...
                        </span>
                    </div>
                </div>
            </div>

            <span class="patient-detail-heading-icon"
                  aria-hidden="true">
                <i class="fa-solid fa-address-card"></i>
            </span>
        </div>

        <!-- THÔNG BÁO LỖI TẢI DỮ LIỆU -->
        <div id="appointment-profile-message"
             class="alert"
             role="status"
             aria-live="polite"
             hidden></div>

        <div id="appointment-profile-loading"
             class="patient-detail-loading"
             role="status"
             aria-live="polite">

            <i class="fa-solid fa-spinner fa-spin"
               aria-hidden="true"></i>

            <span>Đang tải hồ sơ bệnh nhân...</span>
        </div>

        <!-- FORM HỒ SƠ -->
        <form id="appointment-profile-form"
              class="patient-detail-form"
              aria-busy="true">

            <input id="profile-patient-id" type="hidden">
            <input id="profile-appointment-id" type="hidden">

            <fieldset id="appointment-profile-fields" disabled>
                <legend class="visually-hidden">
                    Thông tin hồ sơ bệnh nhân
                </legend>

                <div class="patient-detail-panel">

                    <!-- 1. THÔNG TIN BỆNH NHÂN -->
                    <section class="patient-detail-section patient-detail-personal-card"
                             aria-labelledby="profile-personal-title">

                        <div class="patient-detail-card-heading">
                            <span class="patient-detail-section-icon"
                                  aria-hidden="true">
                                <i class="fa-solid fa-user"></i>
                            </span>

                            <h2 id="profile-personal-title">
                                Thông tin bệnh nhân
                            </h2>
                        </div>

                        <div class="patient-detail-personal-fields">

                            <div class="patient-detail-field">
                                <label for="profile-name"
                                       class="form-label">
                                    Họ tên
                                    <span class="text-danger">*</span>
                                </label>

                                <input id="profile-name"
                                       class="form-control"
                                       type="text"
                                       maxlength="255"
                                       autocomplete="name"
                                       required>
                            </div>

                            <div class="patient-detail-field">
                                <label for="profile-birth-date"
                                       class="form-label">
                                    Ngày sinh
                                </label>

                                <div class="birth-date-group">
                                    <input id="profile-birth-date"
                                           class="form-control"
                                           type="text"
                                           inputmode="numeric"
                                           autocomplete="off"
                                           maxlength="10"
                                           placeholder="dd/mm/yyyy"
                                           pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
                                           title="Nhập ngày/tháng/năm, ví dụ 20/08/1998">

                                    <button id="profile-open-birth-calendar"
                                            class="calendar-button"
                                            type="button"
                                            title="Chọn ngày sinh"
                                            aria-label="Mở lịch chọn ngày sinh">
                                        <i class="fa-regular fa-calendar-days"
                                           aria-hidden="true"></i>
                                    </button>

                                    <input id="profile-birth-date-picker"
                                           class="native-date-picker"
                                           type="date"
                                           min="1000-01-01"
                                           tabindex="-1"
                                           aria-label="Lịch chọn ngày sinh">
                                </div>
                            </div>

                            <div class="patient-detail-field">
                                <label for="profile-gender"
                                       class="form-label">
                                    Giới tính
                                </label>

                                <select id="profile-gender"
                                        class="form-select">
                                    <option value="">Chưa cung cấp</option>
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>

                            <div class="patient-detail-field">
                                <label for="profile-phone"
                                       class="form-label">
                                    Số điện thoại
                                </label>

                                <input id="profile-phone"
                                       class="form-control"
                                       type="tel"
                                       maxlength="15"
                                       autocomplete="tel"
                                       pattern="[+]?[0-9]{9,14}"
                                       title="Nhập 9–14 chữ số, có thể bắt đầu bằng dấu +">
                            </div>

                            <div class="patient-detail-field">
                                <label for="profile-email"
                                       class="form-label">
                                    Email
                                </label>

                                <input id="profile-email"
                                       class="form-control"
                                       type="email"
                                       maxlength="255"
                                       autocomplete="email">
                            </div>

                            <div class="patient-detail-field">
                                <label for="profile-emergency-phone"
                                       class="form-label">
                                    Số điện thoại khẩn cấp
                                </label>

                                <input id="profile-emergency-phone"
                                       class="form-control"
                                       type="tel"
                                       maxlength="15"
                                       pattern="[+]?[0-9]{9,14}"
                                       title="Nhập 9–14 chữ số, có thể bắt đầu bằng dấu +">
                            </div>

                            <div class="patient-detail-field patient-detail-field-wide">
                                <label for="profile-address"
                                       class="form-label">
                                    Địa chỉ
                                </label>

                                <input id="profile-address"
                                       class="form-control"
                                       type="text"
                                       maxlength="255"
                                       autocomplete="street-address">
                            </div>

                            <div class="patient-detail-field patient-detail-field-wide patient-detail-history-field">
                                <label for="profile-medical-history"
                                       class="form-label">
                                    Tiền sử bệnh
                                </label>

                                <textarea id="profile-medical-history"
                                          class="form-control"
                                          rows="4"
                                          maxlength="5000"
                                          placeholder="Thông tin tiền sử bệnh do bệnh nhân cung cấp"></textarea>
                            </div>

                        </div>
                    </section>

                    <!-- 2. SỐ ĐO CỦA LỊCH KHÁM HÔM NAY -->
                    <section class="patient-detail-section patient-detail-vitals-section"
                             aria-labelledby="profile-vitals-title">

                        <div class="patient-detail-card-heading">
                            <span class="patient-detail-section-icon"
                                  aria-hidden="true">
                                <i class="fa-solid fa-heart-pulse"></i>
                            </span>

                            <h2 id="profile-vitals-title">
                                Số đo trước khám
                            </h2>
                        </div>

                        <div id="profile-current-visit"
                             class="patient-detail-current-visit"
                             hidden>

                            <span class="patient-detail-current-visit-label">
                                Lịch khám hôm nay
                            </span>

                            <div id="profile-current-visit-summary"></div>

                            <span id="profile-current-visit-status"
                                  class="patient-detail-status"></span>
                        </div>

                        <div id="profile-current-shift"
                             class="patient-detail-current-shift"
                             hidden></div>

                        <div id="profile-vitals-note"
                             class="patient-detail-vitals-note"
                             role="status"></div>

                        <fieldset id="profile-vitals-fields" disabled>
                            <legend class="visually-hidden">
                                Các số đo trước khám
                            </legend>

                            <div class="patient-detail-vitals-grid">

                                <div class="patient-detail-field">
                                    <label for="profile-weight"
                                           class="form-label">
                                        Cân nặng
                                    </label>

                                    <div class="input-group">
                                        <input id="profile-weight"
                                               class="form-control"
                                               type="number"
                                               inputmode="decimal"
                                               min="0.01"
                                               max="999.99"
                                               step="0.01"
                                               placeholder="Chưa đo">

                                        <span class="input-group-text">
                                            kg
                                        </span>
                                    </div>
                                </div>

                                <div class="patient-detail-field">
                                    <label for="profile-height"
                                           class="form-label">
                                        Chiều cao
                                    </label>

                                    <div class="input-group">
                                        <input id="profile-height"
                                               class="form-control"
                                               type="number"
                                               inputmode="decimal"
                                               min="0.01"
                                               max="999.99"
                                               step="0.01"
                                               placeholder="Chưa đo">

                                        <span class="input-group-text">
                                            cm
                                        </span>
                                    </div>
                                </div>

                                <div class="patient-detail-field">
                                    <label for="profile-systolic"
                                           class="form-label">
                                        Huyết áp tâm thu
                                    </label>

                                    <div class="input-group">
                                        <input id="profile-systolic"
                                               class="form-control"
                                               type="number"
                                               inputmode="numeric"
                                               min="1"
                                               max="65535"
                                               step="1"
                                               placeholder="Chưa đo">

                                        <span class="input-group-text">
                                            mmHg
                                        </span>
                                    </div>
                                </div>

                                <div class="patient-detail-field">
                                    <label for="profile-diastolic"
                                           class="form-label">
                                        Huyết áp tâm trương
                                    </label>

                                    <div class="input-group">
                                        <input id="profile-diastolic"
                                               class="form-control"
                                               type="number"
                                               inputmode="numeric"
                                               min="1"
                                               max="65535"
                                               step="1"
                                               placeholder="Chưa đo">

                                        <span class="input-group-text">
                                            mmHg
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </fieldset>
                    </section>

                    <!-- 3. DANH SÁCH LỊCH SỬ KHÁM -->
                    <section class="patient-detail-section patient-detail-history-card"
                             aria-labelledby="profile-visit-title">

                        <div class="patient-detail-card-heading">
                            <span class="patient-detail-section-icon"
                                  aria-hidden="true">
                                <i class="fa-solid fa-calendar-check"></i>
                            </span>

                            <h2 id="profile-visit-title">
                                Lịch sử khám
                            </h2>
                        </div>

                        <div id="profile-no-visit"
                             class="patient-detail-empty"
                             role="status"
                             hidden>
                            <i class="fa-regular fa-calendar"
                               aria-hidden="true"></i>

                            <p>Bệnh nhân chưa có lịch khám.</p>
                        </div>

                        <ul id="profile-visit-list"
                            class="patient-detail-visit-list"
                            aria-label="Danh sách lịch khám của bệnh nhân"></ul>

                    </section>
                </div>
            </fieldset>
        </form>

        <!-- NÚT THAO TÁC Ở CUỐI TRANG -->
        <div class="patient-detail-footer">
            <span id="patient-detail-save-status"
                  class="patient-detail-save-status"
                  role="status"
                  aria-live="polite"></span>

            <div class="patient-detail-footer-actions">

                <button id="appointment-profile-save"
                        class="btn btn-outline-primary patient-detail-save-button"
                        type="submit"
                        form="appointment-profile-form"
                        disabled>
                    <i class="fa-regular fa-floppy-disk"
                       aria-hidden="true"></i>

                    <span>Lưu hồ sơ</span>
                </button>

                <button id="appointment-profile-checkin"
                        class="btn btn-success patient-detail-checkin-button"
                        type="button"
                        disabled>
                    <i class="fa-solid fa-user-check"
                       aria-hidden="true"></i>

                    <span>Đã tiếp nhận</span>
                </button>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Js/Auth/logout.js"></script>
<script src="/Js/TiepNhan/patient-detail.js"></script>

</body>
</html>
