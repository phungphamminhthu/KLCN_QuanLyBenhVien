
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header" class="header">

  <!-- KHU VỰC BÊN PHẢI -->
  <div class="header-right">

    <!-- THÔNG BÁO -->

    <!-- THÔNG BÁO -->
    <div class="notification-wrapper" id="notificationWrapper">

      <!-- NÚT CHUÔNG -->
      <button type="button"
              class="notification-button"
              id="notification-button"
              aria-label="Mở thông báo"
              aria-expanded="false"
              aria-controls="notificationPanel">

    <span class="notification-icon" aria-hidden="true">
      🔔
    </span>

        <!-- SỐ THÔNG BÁO CHƯA ĐỌC -->
        <span id="notificationBadge"
              class="notification-badge"
              hidden>0</span>
      </button>

      <!-- KHUNG THÔNG BÁO -->
      <div class="notification-panel"
           id="notificationPanel"
           role="region"
           aria-labelledby="notificationTitle"
           hidden>

        <!-- HEADER -->
        <div class="notification-header">
          <div>
            <h3 id="notificationTitle">Thông báo</h3>

            <span id="notificationCountText">
          0 thông báo mới
        </span>
          </div>

          <button type="button" id="markAllReadButton">
            Đánh dấu đã đọc
          </button>
        </div>

        <!-- DANH SÁCH -->
        <div class="notification-list" id="notificationList">

          <div class="notification-empty">
            <i class="fa-regular fa-bell"></i>
            <p>Chưa có thông báo nào.</p>
          </div>

        </div>

        <!-- FOOTER -->
        <div class="notification-footer">
          <a th:href="@{/auth/bac-si/thong-bao}">
            Xem tất cả thông báo
          </a>
        </div>

      </div>
    </div>

    <!-- THÔNG TIN BÁC SĨ -->
    <div class="doctor-info">

      <div class="doctor-text">
        <img id="doctorAvatar"
             class="doctor-avatar-image"
             th:src="@{/Images/default-avatar.jpg}"
             alt="Ảnh đại diện bác sĩ">

        <strong id="doctorName">Bác sĩ</strong>
        <small id="doctorEmail">Đang tải thông tin...</small>
      </div>

<!--      <img id="doctorAvatar"-->
<!--           class="doctor-avatar-image"-->
<!--           th:src="@{/Images/default-avatar.jpg}"-->
<!--           alt="Ảnh đại diện bác sĩ">-->

    </div>

  </div>
</header>

</body>
</html>
