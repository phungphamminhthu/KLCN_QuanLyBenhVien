
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header" class="header">

  <!-- KHU VỰC BÊN PHẢI -->
  <div class="header-right">

    <!-- THÔNG BÁO -->
    <div class="notification-wrapper">

      <button type="button"
              class="notification-button"
              id="notificationButton"
              aria-label="Thông báo">
        <span class="notification-icon">🔔</span>
        <span class="notification-badge" id="notificationBadge">0</span>
      </button>

      <div class="notification-panel"
           id="notificationPanel" hidden>

        <div class="notification-header">
          <div>
            <h3>Thông báo</h3>
            <span id="notificationCountText">
                            0 thông báo mới
                        </span>
          </div>

          <button type="button" id="markAllReadButton">
            Đánh dấu đã đọc
          </button>
        </div>

        <div class="notification-list" id="notificationList">
          <!-- JS thông báo render tại đây -->
        </div>

        <div class="notification-footer">
          <a href="/BacSi/thong-bao">
            Xem tất cả thông báo
          </a>
        </div>

      </div>
    </div>

    <!-- THÔNG TIN BÁC SĨ -->
    <div class="doctor-info">

      <div class="doctor-text">
        <strong id="doctorName">Bác sĩ</strong>
        <small id="doctorEmail">Đang tải thông tin...</small>
      </div>

      <img id="doctorAvatar"
           class="doctor-avatar-image"
           th:src="@{/Images/default-avatar.jpg}"
           alt="Ảnh đại diện bác sĩ">

    </div>

  </div>
</header>

</body>
</html>
