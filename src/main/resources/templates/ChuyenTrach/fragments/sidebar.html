<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar reception-sidebar"
       th:fragment="sidebar">

    <!-- LOGO MEDCARE -->
    <div class="sidebar-logo">
        <div class="logo-icon">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </div>

        <div class="logo-text">
            <strong>MedCare Hospital</strong>
            <span>Hệ thống quản lý bệnh viện</span>
        </div>
    </div>

    <!-- MENU NHÂN VIÊN CHUYÊN TRÁCH -->
    <nav class="sidebar-menu"
         aria-label="Menu nhân viên chuyên trách">

        <!-- TỔNG QUAN -->
        <a th:href="@{/ChuyenTrach/dashboard}"
           class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                </span>
                Tổng quan
            </span>
        </a>

        <!-- BỆNH NHÂN -->
        <div class="sidebar-menu-group">

            <button type="button"
                    class="sidebar-menu-title"
                    aria-expanded="false"
                    aria-controls="submenu-benh-nhan">
                <span class="sidebar-title-content">
                    <i class="fa-solid fa-users" aria-hidden="true"></i>
                    <span>Bệnh nhân</span>
                </span>

                <span class="sidebar-group-arrow" aria-hidden="true"></span>
            </button>

            <div class="sidebar-submenu" id="submenu-benh-nhan">

                <a th:href="@{/ChuyenTrach/benh-nhan}"
                   class="menu-link submenu-link">
                    <span>
                        <span class="menu-icon">
                            <i class="fa-solid fa-list" aria-hidden="true"></i>
                        </span>
                        Danh sách bệnh nhân
                    </span>
                </a>

                <a th:href="@{/ChuyenTrach/benh-nhan-cho}"
                   class="menu-link submenu-link">
                    <span>
                        <span class="menu-icon">
                            <i class="fa-solid fa-hourglass-half"
                               aria-hidden="true"></i>
                        </span>
                        Bệnh nhân đang chờ
                    </span>
                </a>

            </div>
        </div>

        <!-- KHÁM CHUYÊN TRÁCH -->
        <div class="sidebar-menu-group">

            <button type="button"
                    class="sidebar-menu-title"
                    aria-expanded="false"
                    aria-controls="submenu-kham-chuyen-trach">
                <span class="sidebar-title-content">
                    <i class="fa-solid fa-stethoscope"
                       aria-hidden="true"></i>
                    <span>Khám chuyên trách</span>
                </span>

                <span class="sidebar-group-arrow" aria-hidden="true"></span>
            </button>

            <div class="sidebar-submenu"
                 id="submenu-kham-chuyen-trach">

                <a th:href="@{/ChuyenTrach/chi-dinh}"
                   class="menu-link submenu-link">
                    <span>
                        <span class="menu-icon">
                            <i class="fa-solid fa-clipboard-list"
                               aria-hidden="true"></i>
                        </span>
                        Danh sách chỉ định
                    </span>
                </a>

            </div>
        </div>

        <!-- KẾT QUẢ -->
        <div class="sidebar-menu-group">

            <button type="button"
                    class="sidebar-menu-title"
                    aria-expanded="false"
                    aria-controls="submenu-ket-qua">
                <span class="sidebar-title-content">
                    <i class="fa-solid fa-file-medical"
                       aria-hidden="true"></i>
                    <span>Kết quả</span>
                </span>

                <span class="sidebar-group-arrow" aria-hidden="true"></span>
            </button>

            <div class="sidebar-submenu" id="submenu-ket-qua">

                <a th:href="@{/ChuyenTrach/ket-qua-da-thuc-hien}"
                   class="menu-link submenu-link">
                    <span>
                        <span class="menu-icon">
                            <i class="fa-solid fa-square-check"
                               aria-hidden="true"></i>
                        </span>
                        Kết quả đã thực hiện
                    </span>
                </a>

            </div>
        </div>

        <!-- LỊCH SỬ TIẾP NHẬN -->
        <a th:href="@{/ChuyenTrach/history}"
           class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-solid fa-clock-rotate-left"
                       aria-hidden="true"></i>
                </span>
                Lịch sử tiếp nhận
            </span>
        </a>

        <!-- HỒ SƠ CÁ NHÂN -->
        <a th:href="@{/ChuyenTrach/ho-so-ca-nhan}"
           class="menu-link">
            <span>
                <span class="menu-icon">
                    <i class="fa-regular fa-user"
                       aria-hidden="true"></i>
                </span>
                Hồ sơ cá nhân
            </span>
        </a>

    </nav>

    <!-- ĐĂNG XUẤT -->
    <div class="sidebar-logout">
        <button type="button"
                id="logoutButton"
                class="logout-button">

            <i class="fa-solid fa-arrow-right-from-bracket"
               aria-hidden="true"></i>

            <span>Đăng xuất</span>
        </button>
    </div>

</aside>

</body>
</html>
