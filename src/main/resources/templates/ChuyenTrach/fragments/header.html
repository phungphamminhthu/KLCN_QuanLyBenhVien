<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS thông báo -->
    <link rel="stylesheet"
          th:href="@{/Css/ChuyenTrach/notification.css}">
</head>

<body>

<header class="reception-header"
        th:fragment="header(refreshButtonId, roleName)">

    <!-- NGÀY HIỆN TẠI VÀ LÀM MỚI -->
    <div class="header-left">
        <div class="header-date">
            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
            <span id="header-current-date">Đang tải ngày...</span>
        </div>

        <button type="button"
                class="header-refresh-button"
                th:id="${refreshButtonId}">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span>Làm mới dữ liệu</span>
        </button>
    </div>

    <!-- THÔNG BÁO VÀ THÔNG TIN NHÂN VIÊN -->
    <div class="header-right">

        <!-- CHUÔNG THÔNG BÁO -->
        <div class="header-notification"
             id="notificationWrapper">

            <button type="button"
                    id="notificationButton"
                    class="notification-button"
                    aria-label="Thông báo"
                    aria-expanded="false"
                    aria-controls="notificationDropdown">

                <i class="fa-solid fa-bell"
                   aria-hidden="true"></i>

                <!-- SỐ THÔNG BÁO CHƯA ĐỌC -->
                <span id="notificationBadge"
                      class="notification-badge"
                      hidden>
                    0
                </span>
            </button>

            <!-- DROPDOWN THÔNG BÁO -->
            <div id="notificationDropdown"
                 class="notification-dropdown"
                 hidden>

                <!-- TIÊU ĐỀ -->
                <div class="notification-dropdown-header">

                    <div class="notification-header-info">
                        <h3>Thông báo</h3>

                        <p id="notificationCountText">
                            Đang tải thông báo...
                        </p>
                    </div>

                    <!-- ĐÁNH DẤU TẤT CẢ ĐÃ ĐỌC -->
                    <button type="button"
                            id="markAllReadButton"
                            class="notification-mark-all">
                        Đánh dấu đã đọc
                    </button>
                </div>

                <!-- DANH SÁCH THÔNG BÁO -->
                <div id="notificationList"
                     class="notification-list">

                    <div class="notification-loading">
                        Đang tải thông báo...
                    </div>
                </div>

                <!-- FOOTER -->
                <div class="notification-dropdown-footer">
                    <a th:href="@{/thong-bao}"
                       href="/thong-bao">
                        Xem tất cả thông báo
                    </a>
                </div>
            </div>
        </div>

        <!-- THÔNG TIN NHÂN VIÊN -->
        <div class="header-user">

            <!-- ẢNH ĐẠI DIỆN -->
            <img id="header-user-avatar"
                 class="header-avatar"
                 th:src="@{/Images/default-avatar.jpg}"
                 src="/Images/default-avatar.jpg"
                 alt="Ảnh đại diện nhân viên"
                 onerror="this.onerror=null; this.src='/Images/default-avatar.jpg';">

            <!-- THÔNG TIN TÀI KHOẢN -->
            <div class="header-user-info">

                <strong id="header-user-name"
                        th:text="${currentUserName ?: 'Nhân viên'}">
                    Nhân viên
                </strong>

                <span id="header-user-email"
                      th:text="${currentUserEmail ?: ''}">
                </span>

                <small id="header-user-role"
                       th:text="${roleName ?: 'Nhân viên'}">
                    Nhân viên
                </small>

            </div>
        </div>
    </div>
</header>
</body>
</html>
